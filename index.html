<style>
/* ============ PALETA UTEG ============ */
:root{
  --uteg-azul:#002B6F;
  --uteg-azul-claro:#002B6F;
  --uteg-amarillo:#F5B400;
  --uteg-fondo:#F4F6F9;
  --uteg-texto:#0b1e3b;
  --chat-bg:#f5f7fb;
  --bubble-bot:#ffffff;
  --bubble-user:#003A8F;
  --input-bg:#ffffff;
}

/* ===== MODO OSCURO ===== */
body.dark{
  --uteg-fondo:#0f172a;
  --uteg-texto:#e5e7eb;
  --chat-bg:#020617;
  --bubble-bot:#020617;
  --bubble-user:#003A8F;
  --input-bg:#020617;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:var(--uteg-fondo);
  color:var(--uteg-texto);
  font-family:'Inter', Arial, sans-serif;
}

/* ============ CHAT APP ============ */
.chat-app{
  max-width:420px;
  height:calc(100vh - 40px);
  margin:20px auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.chat-header{
  background:linear-gradient(135deg,var(--uteg-azul),var(--uteg-azul-claro));
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.avatar img{
  width:80%;
  height:100%;
  object-fit:contain;
}


/* BODY */
.chat-body{
  flex:1;
  padding:16px;
  overflow-y:auto;
  background:var(--chat-bg);
}

/* MENSAJES */
.message{
  display:flex;
  margin-bottom:12px;
  animation:bubbleIn .35s cubic-bezier(.22,1.12,.6,1.05) both;
}

.message.user{ justify-content:flex-end; }
.message.bot{ justify-content:flex-start; }

.bubble{
  max-width:80%;
  padding:12px 14px;
  border-radius:14px;
  font-size:14px;
  line-height:1.5;
}

.user .bubble{
  background:var(--bubble-user);
  color:#fff;
  border-bottom-right-radius:4px;
}

.bot .bubble{
  background:var(--bubble-bot);
  color:var(--uteg-texto);
  border-left:4px solid var(--uteg-amarillo);
  border-bottom-left-radius:4px;
}

/* INPUT */
.chat-input{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #e0e0e0;
  background:var(--input-bg);
}

.chat-input textarea{
  flex:1;
  resize:none;
  border-radius:12px;
  border:1px solid #d6dbe5;
  padding:10px;
  font-size:14px;
  font-family:inherit;
  min-height:38px;
  max-height:120px;
  overflow-y:hidden;
}

.chat-input textarea:focus{
  outline:none;
  border-color:var(--uteg-azul-claro);
}

.chat-input button{
  background:var(--uteg-azul);
  color:#fff;
  border:none;
  border-radius:12px;
  padding:0 16px;
  font-size:18px;
  cursor:pointer;
}

/* ===== Animación burbuja ===== */
@keyframes bubbleIn{
  0%{ opacity:0; transform:translateY(12px) scale(.96); }
  60%{ opacity:1; transform:translateY(-2px) scale(1.01); }
  100%{ transform:translateY(0) scale(1); }
}

/* ===== Glow bot ===== */
.message.bot .bubble{
  animation:botGlow .6s ease-out;
}

@keyframes botGlow{
  40%{
    box-shadow:
      0 0 18px rgba(11,94,215,.35),
      0 0 4px rgba(11,94,215,.25);
  }
}

/* ===== Typing dots ===== */
.typing .bubble{
  display:flex;
  gap:6px;
  align-items:center;
}

.typing-dot{
  width:6px;
  height:6px;
  background:#6b7c93;
  border-radius:50%;
  animation:typingBounce 1.4s infinite;
}

.typing-dot:nth-child(2){ animation-delay:.2s; }
.typing-dot:nth-child(3){ animation-delay:.4s; }

@keyframes typingBounce{
  0%,80%,100%{ transform:scale(.6); opacity:.4; }
  40%{ transform:scale(1); opacity:1; }
}
#toggleTheme{
  margin-left:auto;
  background:rgba(255,255,255,.18);
  border:none;
  border-radius:50%;
  width:34px;
  height:34px;
  color:#fff;
  cursor:pointer;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}
</style>
</head>

<b>¿QUÉ ES LA DOBLE TITULACIÓN?</b><br><br>

La doble titulación es un beneficio académico que te permite obtener una segunda licenciatura aprovechando hasta el 60% de las materias cursadas en tu primera carrera.<br>
Esto reduce de forma significativa el tiempo y el costo total de la segunda licenciatura.<br><br>

<b>¿CÓMO FUNCIONA?</b><br>
• Primero debes concluir y titularte de tu primera licenciatura.<br>
• Posteriormente, solo cursas el 40% restante de la segunda carrera.<br>
• La segunda licenciatura se cursa completamente en modalidad en línea.<br><br>

<b>BENEFICIOS ACADÉMICOS Y ECONÓMICOS</b><br>
• Si cuentas con una beca activa en la primera licenciatura, se respeta el mismo porcentaje en la segunda.<br>
• Se aplica un descuento del 50% en el trámite de titulación de la segunda licenciatura, en cualquier modalidad.<br>
• El servicio social realizado en la primera licenciatura aplica también para la segunda.<br><br>

<b>REQUISITOS IMPORTANTES</b><br>
• El beneficio debe contratarse antes de egresar.<br>
• Es necesario contar con al menos el 50% de los créditos avanzados de la primera licenciatura.<br>
• Una vez egresado, ya no es posible aplicar el beneficio de doble titulación.<br><br>

<b>PORCENTAJES DE EQUIVALENCIA MÁS COMUNES.</b><br>
• Administración y Liderazgo Empresarial + Contaduría: 58%.<br>
• Administración y Liderazgo Empresarial + Mercadotecnia: 63%.<br>
• Administración y Liderazgo Empresarial + Negocios Internacionales: 66%.<br>
• Contaduría + Mercadotecnia: 63%.<br>
• Ingeniería en Sistemas + Ingeniería Industrial en Producción: 52%.<br>
• Contaduría + Negocios Internacionales: 63%.<br><br>

La doble titulación es una opción ideal para ampliar tu perfil profesional, obtener dos títulos universitarios y mejorar tus oportunidades laborales en menos tiempo.
`

<b>REVALIDACIÓN Y EQUIVALENCIA DE ESTUDIOS</b><br><br>

Las revalidaciones y equivalencias de estudios se realizan de manera presencial en el área de Control Escolar.<br>
Para iniciar cualquiera de estos procesos, el aspirante debe presentar un certificado parcial de estudios, el cual es el documento base para el análisis académico.<br><br>

<b>ANÁLISIS ACADÉMICO</b><br>
Con el certificado parcial, Control Escolar revisa las materias previamente cursadas y determina qué asignaturas pueden reconocerse conforme al plan de estudios vigente.<br>
Este análisis es exclusivo de Control Escolar; el asesor no realiza dictámenes académicos y no puede prometer porcentajes ni número de materias antes de la resolución oficial.<br><br>

<b>¿CUÁNDO APLICA LA REVALIDACIÓN?</b><br>
La revalidación aplica cuando el aspirante proviene de un plan de estudios con el mismo RVOE.<br>
En el caso de programas incorporados a la Universidad de Guadalajara, los RVOE son los mismos, por lo que la revalidación es obligatoria.<br>
Cuando un aspirante ya cursó previamente estudios en un programa con incorporación UdeG, no es posible ingresar desde cero; se debe realizar forzosamente la revalidación y continuar a partir del avance ya cursado.<br><br>

<b>¿CUÁNDO APLICA LA EQUIVALENCIA?</b><br>
La equivalencia aplica cuando el plan de estudios o el RVOE es diferente.<br>
Esto ocurre comúnmente en programas con incorporación SEP o cuando el aspirante proviene de otra institución.<br>
En estos casos, el alumno puede solicitar la equivalencia de materias, donde se reconoce un porcentaje de lo previamente cursado, dependiendo de la compatibilidad entre programas, o bien puede optar por iniciar desde cero si así lo decide.<br><br>

<b>DIFERENCIA ENTRE REVALIDACIÓN Y EQUIVALENCIA</b><br>
La revalidación se utiliza cuando el RVOE es el mismo y las materias se reconocen tal como fueron cursadas.<br>
La equivalencia se aplica cuando los planes de estudio o RVOE son distintos y el reconocimiento depende del análisis académico y del porcentaje de coincidencia entre programas.<br><br>

<b>MENSAJE IMPORTANTE PARA EL ASPIRANTE</b><br>
Ningún asesor puede asegurar cuántas materias se revalidarán o equivaldrán antes de que Control Escolar emita el dictamen correspondiente.<br>
El resultado final siempre depende del análisis oficial del certificado parcial y del plan de estudios aplicable.

  response: `
<b>GESTIÓN DE CITAS EN UTEG</b><br><br>

La gestión de citas en UTEG sigue un proceso definido cuyo objetivo es asegurar un seguimiento correcto del aspirante y el reconocimiento adecuado de la venta.<br>
Este proceso involucra tanto al equipo de Contact Center (CC) como al personal de plantel, y se gestiona a través de Salesforce.<br><br>

<b>CREACIÓN Y ORIGEN DE LA CITA</b><br>
El proceso inicia cuando el equipo de CC crea el evento o cita con base en el seguimiento previo realizado por medios digitales.<br>
Este seguimiento puede ir desde un convencimiento ya trabajado hasta una cita donde el proceso se realizará completamente desde cero en el plantel.<br><br>

En Salesforce, el asesor de CC debe dejar una radiografía clara y detallada del seguimiento realizado, permitiendo que el plantel conozca el contexto del aspirante y la forma correcta de abordar la cita.<br><br>

Una vez creada, la cita se asigna con estatus “Sin gestión” y se canaliza al coordinador de plantel, quien decide su asignación conforme a criterios internos.<br><br>

<b>CONTACTO Y CONFIRMACIÓN DE LA CITA</b><br>
Una vez asignada la cita, el asesor de plantel debe comunicarse de inmediato con el aspirante.<br>
El primer intento debe realizarse vía llamada telefónica y, en caso de no obtener respuesta, se debe continuar el contacto por WhatsApp.<br><br>

Al obtener respuesta del aspirante, el asesor debe enviar el documento foliado de cita a plantel, cargar la evidencia correspondiente en Salesforce y actualizar el estatus de la cita según el resultado:<br>
• <b>Confirmada:</b> cuando el aspirante acepta la cita.<br>
• <b>En espera de confirmación:</b> cuando no se obtiene respuesta por ningún medio.<br>
• <b>Cancelada:</b> cuando el aspirante indica que no acepta la cita, realizando previamente labor de convencimiento.<br><br>

<b>DÍA DE LA CITA</b><br>
El día de la cita, si el aspirante asiste al plantel, debe recibirse en piso de venta y la cita debe tipificarse como “Asistió” antes de iniciar la conversación.<br>
Esta acción es indispensable, ya que permite que la venta se registre automáticamente como <b>Venta Compartida</b> en caso de concretarse la inscripción.<br><br>

Si el aspirante no asiste, se deben esperar 30 minutos posteriores a la hora pactada.<br>
Durante este periodo se debe intentar contactarlo para conocer el motivo de la inasistencia.<br>
Si no se obtiene respuesta, la cita debe tipificarse como “No asistió”.<br><br>

<b>SEGUIMIENTO POST CITA</b><br>
Toda cita asistida que no se convierta en inscripción debe cerrar con un acuerdo claro y definido.<br>
Estos acuerdos pueden incluir fecha de pago, reagenda de cita, envío de información a padres, validación académica o cambio de carrera.<br>
No deben dejarse seguimientos abiertos o indefinidos como “luego te marco”.<br><br>

El seguimiento debe respetar la fecha y hora pactadas.<br>
Si no se obtiene respuesta, el asesor debe proponer una alternativa inmediata y continuar el contacto.<br><br>

El flujo del ACW funciona de la siguiente manera:<br><br>

• Registrar seguimientos o compromisos.<br>

/* ========= DETECCIÓN ========= */
function detectarIntencion(texto){
  if(!intents.length){
    return "El asistente está en configuración. Intenta más tarde.";
  }

  const palabrasUsuario=limpiarTexto(texto);
  let mejor=null, scoreMax=0;

  intents.forEach(intent=>{
    let score=0;
    intent.keywords.forEach(k=>{
      const i=palabrasUsuario.indexOf(k);
      if(i!==-1) score+=(i===0?1:i+1);
    });
    if(score>scoreMax){ scoreMax=score; mejor=intent; }
  });

return mejor
  ? respuestaHumana(mejor.response)
  : respuestaHumana("Puedo ayudarte con inscripción, becas, periodos y requisitos.");
}
// ===== Indicador escribiendo =====
let typingMsg = null;

function mostrarTyping(){
  const chat = document.getElementById("chat");

  typingMsg = document.createElement("div");
  typingMsg.className = "message bot typing";

  const bubble = document.createElement("div");
  bubble.className = "bubble typing-dots";
  bubble.innerHTML = "UTEG está escribiendo";

  typingMsg.appendChild(bubble);
  chat.appendChild(typingMsg);

  // scroll al indicador
  requestAnimationFrame(() => {
    chat.scrollTop = typingMsg.offsetTop - 12;
  });
}

function ocultarTyping(){
  if(typingMsg){
    typingMsg.remove();
    typingMsg = null;
  }
}
/* ========= CHAT ========= */
function enviarMensaje(){
  const input = document.getElementById("input");
  const texto = input.value.trim();
  if(!texto) return;

  // 1️⃣ mensaje del usuario
  agregarMensaje(texto, "user");
  input.value = "";
  input.style.height = "38px";

  // 2️⃣ mostrar "escribiendo..."
  mostrarTyping();

  // 3️⃣ simular respuesta
  setTimeout(() => {
    ocultarTyping();
    const respuesta = detectarIntencion(texto);
    agregarMensaje(respuesta, "bot");
  }, 800);
}


function agregarMensaje(texto, tipo){
  const chat = document.getElementById("chat");
  const msg = document.createElement("div");
  msg.className = "message " + tipo;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = texto;

  msg.appendChild(bubble);
  chat.appendChild(msg);

  // ⏱️ Espera a que el navegador pinte el mensaje
  requestAnimationFrame(() => {
    chat.scrollTop = msg.offsetTop - 12;
  });
}
  document.getElementById("input").addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault(); // evita salto de línea
    enviarMensaje();    // envía el mensaje
  }
});

toggleTheme.addEventListener("click", () => {
  body.classList.toggle("dark");

  const esOscuro = body.classList.contains("dark");
  toggleTheme.textContent = esOscuro ? "☀️" : "🌙";
  localStorage.setItem("uteg-theme", esOscuro ? "dark" : "light");
});
